<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Bryn Tavle</title>

<style>

body{
    margin:0;
    background:#000;
    color:#ffb300;
    font-family:Arial,Helvetica,sans-serif;
    overflow:hidden;
}

#clock{
    text-align:right;
    font-size:42px;
    font-weight:bold;
    padding:10px 20px;
    border-bottom:2px solid #ffb300;
}

.section{
    padding:12px 20px 8px 20px;
}

.stopTitle{
    display:inline-block;
    background:#ffb300;
    color:#000;
    padding:6px 14px;
    border-radius:4px;
    font-size:30px;
    font-weight:bold;
    margin-bottom:10px;
}

.route{
    margin-bottom:10px;
}

.route-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.route-name{
    font-size:27px;
    font-weight:bold;
}

.next-departure{
    font-size:30px;
    font-weight:bold;
    min-width:100px;
    text-align:right;
}

.delayed{
    color:#ff4444;
}

.future-times{
    margin-left:25px;
    font-size:22px;
    color:#ffb300;
}

.future-time{
    margin-right:25px;
}

.separator{
    height:2px;
    background:#333;
    margin:5px 0;
}

#updated{
    position:fixed;
    bottom:5px;
    right:15px;
    color:#888;
    font-size:15px;
}

</style>
</head>
<body>

<div id="clock"></div>

<div id="content"></div>

<div id="updated"></div>

<script>

const STOPS = [
{
    name:"BRYN BRANNSTASJON",
    id:"NSR:StopPlace:6096"
},
{
    name:"BRYNSENGVEIEN",
    id:"NSR:StopPlace:6094"
}
];

function updateClock(){

    document.getElementById("clock").textContent =
        new Date().toLocaleTimeString(
            "no-NO",
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        );
}

setInterval(updateClock,1000);
updateClock();

function formatTime(value){

    return new Date(value)
        .toLocaleTimeString(
            "no-NO",
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        );
}

function minutesUntil(value){

    const diff =
        Math.round(
            (new Date(value) - new Date())
            / 60000
        );

    return Math.max(diff,0) + " min";
}

function safeId(text){

    return text
        .replaceAll(" ","_")
        .replaceAll("/","_")
        .replaceAll(".","_");
}

async function fetchStop(stopId){

    const query = `
    {
      stopPlace(id:"${stopId}") {

        estimatedCalls(numberOfDepartures:50) {

          aimedDepartureTime

          expectedDepartureTime

          destinationDisplay{
            frontText
          }

          serviceJourney{
            journeyPattern{
              line{
                publicCode
              }
            }
          }
        }
      }
    }
    `;

    const response = await fetch(
        "https://api.entur.io/journey-planner/v3/graphql",
        {
            method:"POST",
            headers:{
                "Content-Type":"application/json",
                "ET-Client-Name":"bryn-tavle"
            },
            body:JSON.stringify({query})
        }
    );

    const json = await response.json();

    return json.data.stopPlace.estimatedCalls;
}

async function buildBoard(){

    const content =
        document.getElementById("content");

    content.innerHTML = "";

    for(const stop of STOPS){

        const departures =
            await fetchStop(stop.id);

        const groups = {};

        departures.forEach(dep => {

            const line =
                dep.serviceJourney
                .journeyPattern
                .line
                .publicCode;

            const destination =
                dep.destinationDisplay
                .frontText;

            const key =
                `${line} ${destination}`;

            if(!groups[key]){
                groups[key] = [];
            }

            groups[key].push(dep);
        });

        let html = `
        <div class="section">
            <div class="stopTitle">
                ${stop.name}
            </div>
        `;

        Object.keys(groups)
            .sort()
            .forEach(key => {

                const id =
                    safeId(stop.name + "_" + key);

                html += `
                <div class="route" id="${id}">

                    <div class="route-header">

                        <div class="route-name">
                            ${key}
                        </div>

                        <div class="next-departure">
                            --
                        </div>

                    </div>

                    <div class="future-times">
                        ...
                    </div>

                </div>
                `;
            });

        html += `
        </div>

        <div class="separator"></div>
        `;

        content.innerHTML += html;
    }
}

async function updateData(){

    for(const stop of STOPS){

        const departures =
            await fetchStop(stop.id);

        const groups = {};

        departures.forEach(dep => {

            const line =
                dep.serviceJourney
                .journeyPattern
                .line
                .publicCode;

            const destination =
                dep.destinationDisplay
                .frontText;

            const key =
                `${line} ${destination}`;

            if(!groups[key]){
                groups[key] = [];
            }

            groups[key].push(dep);
        });

        Object.keys(groups)
        .forEach(key => {

            const id =
                safeId(stop.name + "_" + key);

            const route =
                document.getElementById(id);

            if(!route) return;

            const deps =
                groups[key].slice(0,5);

            if(deps.length === 0) return;

            const first =
                deps[0];

            const nextElement =
                route.querySelector(
                    ".next-departure"
                );

            nextElement.textContent =
                minutesUntil(
                    first.expectedDepartureTime
                );

            if(
                first.aimedDepartureTime !==
                first.expectedDepartureTime
            ){
                nextElement.classList.add(
                    "delayed"
                );
            }
            else{
                nextElement.classList.remove(
                    "delayed"
                );
            }

            let futureHtml = "";

            deps.slice(1).forEach(dep => {

                const delayed =
                    dep.aimedDepartureTime !==
                    dep.expectedDepartureTime;

                futureHtml += `
                <span class="
                    future-time
                    ${delayed ? 'delayed' : ''}
                ">
                    ${formatTime(
                        dep.expectedDepartureTime
                    )}
                </span>
                `;
            });

            route.querySelector(
                ".future-times"
            ).innerHTML = futureHtml;

        });
    }

    document.getElementById("updated")
    .textContent =
        "Sist oppdatert " +
        new Date().toLocaleTimeString(
            "no-NO",
            {
                hour:"2-digit",
                minute:"2-digit",
                second:"2-digit"
            }
        );
}

(async function(){

    await buildBoard();
    await updateData();

    setInterval(
        updateData,
        10000
    );

})();

</script>

</body>
</html>
