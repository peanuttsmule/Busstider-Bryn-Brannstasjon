<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Bryn Tavle</title>

<style>

body{
    margin:0;
    background:#000;
    color:#ffb300;
    font-family:Arial,Helvetica,sans-serif;
    overflow:hidden;
}

#clock{
    text-align:right;
    font-size:42px;
    font-weight:bold;
    padding:12px 20px;
    border-bottom:2px solid #ffb300;
}

.section{
    padding:15px 20px 5px 20px;
}

.stopTitle{
    font-size:34px;
    font-weight:bold;
    margin-bottom:10px;
    margin-top:5px;
}

.route{
    margin-bottom:10px;
}

.route-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.route-name{
    font-size:28px;
    font-weight:bold;
}

.next-departure{
    font-size:30px;
    font-weight:bold;
    min-width:90px;
    text-align:right;
}

.ticker{
    overflow:hidden;
    white-space:nowrap;
    margin-left:35px;
    height:30px;
}

.ticker-content{
    display:inline-block;
    padding-left:100%;
    animation:scroll 20s linear infinite;
    font-size:24px;
}

.time{
    margin-right:35px;
}

.delayed{
    color:#ff4444;
}

.separator{
    height:2px;
    background:#333;
    margin:8px 0;
}

#updated{
    position:fixed;
    bottom:5px;
    right:15px;
    color:#888;
    font-size:16px;
}

@keyframes scroll{
    from{
        transform:translateX(0);
    }
    to{
        transform:translateX(-100%);
    }
}

</style>
</head>
<body>

<div id="clock"></div>

<div id="content"></div>

<div id="updated"></div>

<script>

const STOPS = [
{
    name:"BRYN BRANNSTASJON",
    id:"NSR:StopPlace:6096"
},
{
    name:"BRYNSENGVEIEN",
    id:"NSR:StopPlace:6094"
}
];

function updateClock(){

    document.getElementById("clock").textContent =
        new Date().toLocaleTimeString(
            "no-NO",
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        );
}

setInterval(updateClock,1000);
updateClock();

function formatTime(dateString){
    return new Date(dateString)
        .toLocaleTimeString(
            "no-NO",
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        );
}

async function fetchStop(stopId){

    const query = `
    {
      stopPlace(id:"${stopId}") {

        estimatedCalls(numberOfDepartures:50) {

          aimedDepartureTime

          expectedDepartureTime

          destinationDisplay {
            frontText
          }

          serviceJourney {
            journeyPattern {
              line {
                publicCode
              }
            }
          }

        }
      }
    }
    `;

    const response = await fetch(
        "https://api.entur.io/journey-planner/v3/graphql",
        {
            method:"POST",
            headers:{
                "Content-Type":"application/json",
                "ET-Client-Name":"bryn-tavle"
            },
            body:JSON.stringify({query})
        }
    );

    const json = await response.json();

    return json.data.stopPlace.estimatedCalls;
}

async function refreshBoard(){

    const content =
        document.getElementById("content");

    content.innerHTML = "";

    for(const stop of STOPS){

        const departures =
            await fetchStop(stop.id);

        let groups = {};

        departures.forEach(dep => {

            const line =
                dep.serviceJourney
                .journeyPattern
                .line
                .publicCode;

            const destination =
                dep.destinationDisplay
                .frontText;

            const key =
                line + " " + destination;

            if(!groups[key]){
                groups[key] = [];
            }

            groups[key].push(dep);
        });

        let html = `
        <div class="section">

        <div class="stopTitle">
        ${stop.name}
        </div>
        `;

        Object.keys(groups)
            .sort()
            .forEach(key => {

                const deps =
                    groups[key]
                    .slice(0,8);

                if(deps.length === 0)
                    return;

                const first =
                    deps[0];

                const firstDelayed =
                    first.aimedDepartureTime !==
                    first.expectedDepartureTime;

                let ticker = "";

                deps.slice(1).forEach(dep => {

                    const delayed =
                        dep.aimedDepartureTime !==
                        dep.expectedDepartureTime;

                    ticker += `
                    <span class="${
                        delayed
                        ? 'time delayed'
                        : 'time'
                    }">
                    ${formatTime(
                       dep.expectedDepartureTime
                    )}
                    </span>
                    `;
                });

                html += `

                <div class="route">

                    <div class="route-header">

                        <div class="route-name">
                            ${key}
                        </div>

                        <div class="${
                          firstDelayed
                          ? 'next-departure delayed'
                          : 'next-departure'
                        }">

                        ${formatTime(
                           first.expectedDepartureTime
                        )}

                        </div>

                    </div>

                    <div class="ticker">

                        <div class="ticker-content">
                            ${ticker}
                        </div>

                    </div>

                </div>

                `;
            });

        html += `
        </div>

        <div class="separator"></div>
        `;

        content.innerHTML += html;
    }

    document.getElementById("updated")
        .textContent =
        "Sist oppdatert " +
        new Date().toLocaleTimeString(
            "no-NO",
            {
                hour:"2-digit",
                minute:"2-digit",
                second:"2-digit"
            }
        );
}

refreshBoard();

setInterval(
    refreshBoard,
    10000
);

</script>

</body>
</html>
