<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Bryn Tavle</title>

<style>

body{
    margin:0;
    background:#000;
    color:#ffb300;
    font-family:Arial,Helvetica,sans-serif;
    overflow:hidden;
}

#clock{
    text-align:right;
    font-size:42px;
    font-weight:bold;
    padding:10px 20px;
    border-bottom:2px solid #ffb300;
}

.section{
    padding:12px 20px 8px 20px;
}

.stopTitle{
    display:inline-block;
    background:#ffb300;
    color:#000;
    padding:6px 14px;
    border-radius:4px;
    font-size:30px;
    font-weight:bold;
    margin-bottom:10px;
}

.route{
    margin-bottom:8px;
}

.route-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.route-name{
    font-size:27px;
    font-weight:bold;
}

.next-departure{
    font-size:30px;
    font-weight:bold;
    min-width:90px;
    text-align:right;
}

.delayed{
    color:#ff4444;
}

.ticker{
    overflow:hidden;
    white-space:nowrap;
    margin-left:25px;
    height:26px;
}

.ticker-content{
    display:inline-block;
    white-space:nowrap;
    padding-left:100%;
    animation:scroll 35s linear infinite;
    font-size:23px;
}

.time{
    margin-right:35px;
}

.separator{
    height:2px;
    background:#333;
    margin:5px 0;
}

#updated{
    position:fixed;
    bottom:5px;
    right:15px;
    color:#888;
    font-size:15px;
}

@keyframes scroll{
    from{
        transform:translateX(0);
    }
    to{
        transform:translateX(-100%);
    }
}

</style>
</head>
<body>

<div id="clock"></div>

<div id="content"></div>

<div id="updated"></div>

<script>

const STOPS = [
{
    name:"BRYN BRANNSTASJON",
    id:"NSR:StopPlace:6096"
},
{
    name:"BRYNSENGVEIEN",
    id:"NSR:StopPlace:6094"
}
];

let boardBuilt = false;

function updateClock(){

    document.getElementById("clock").textContent =
        new Date().toLocaleTimeString(
            "no-NO",
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        );
}

setInterval(updateClock,1000);
updateClock();

function formatTime(value){

    return new Date(value)
        .toLocaleTimeString(
            "no-NO",
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        );
}

function safeId(text){

    return text
        .replaceAll(" ","_")
        .replaceAll("/","_")
        .replaceAll(".","_");
}

async function fetchStop(stopId){

    const query = `
    {
      stopPlace(id:"${stopId}") {

        estimatedCalls(numberOfDepartures:50) {

          aimedDepartureTime

          expectedDepartureTime

          destinationDisplay{
            frontText
          }

          serviceJourney{
            journeyPattern{
              line{
                publicCode
              }
            }
          }

        }
      }
    }
    `;

    const response = await fetch(
        "https://api.entur.io/journey-planner/v3/graphql",
        {
            method:"POST",
            headers:{
                "Content-Type":"application/json",
                "ET-Client-Name":"bryn-tavle"
            },
            body:JSON.stringify({query})
        }
    );

    const json = await response.json();

    return json.data.stopPlace.estimatedCalls;
}

function buildRouteHtml(id,key){

    return `
    <div class="route" id="${id}">

        <div class="route-header">

            <div class="route-name">
                ${key}
            </div>

            <div class="next-departure">
                --
            </div>

        </div>

        <div class="ticker">

            <div class="ticker-content">
                Laster...
            </div>

        </div>

    </div>
    `;
}

async function buildBoard(){

    const content =
        document.getElementById("content");

    content.innerHTML = "";

    for(const stop of STOPS){

        const departures =
            await fetchStop(stop.id);

        const groups = {};

        departures.forEach(dep => {

            const line =
                dep.serviceJourney
                .journeyPattern
                .line
                .publicCode;

            const destination =
                dep.destinationDisplay
                .frontText;

            const key =
                `${line} ${destination}`;

            if(!groups[key]){
                groups[key] = [];
            }

            groups[key].push(dep);
        });

        let html = `
        <div class="section">

            <div class="stopTitle">
                ${stop.name}
            </div>
        `;

        Object.keys(groups)
            .sort()
            .forEach(key => {

                const id =
                    safeId(stop.name+"_"+key);

                html +=
                    buildRouteHtml(id,key);

            });

        html += `
        </div>

        <div class="separator"></div>
        `;

        content.innerHTML += html;
    }

    boardBuilt = true;
}

async function updateData(){

    if(!boardBuilt){
        await buildBoard();
    }

    for(const stop of STOPS){

        const departures =
            await fetchStop(stop.id);

        const groups = {};

        departures.forEach(dep => {

            const line =
                dep.serviceJourney
                .journeyPattern
                .line
                .publicCode;

            const destination =
                dep.destinationDisplay
                .frontText;

            const key =
                `${line} ${destination}`;

            if(!groups[key]){
                groups[key] = [];
            }

            groups[key].push(dep);
        });

        Object.keys(groups)
            .forEach(key => {

                const id =
                    safeId(stop.name+"_"+key);

                const route =
                    document.getElementById(id);

                if(!route) return;

                const deps =
                    groups[key]
                    .slice(0,8);

                if(deps.length===0) return;

                const first =
                    deps[0];

                const next =
                    route.querySelector(
                        ".next-departure"
                    );

                next.textContent =
                    formatTime(
                        first.expectedDepartureTime
                    );

                if(
                    first.aimedDepartureTime !==
                    first.expectedDepartureTime
                ){
                    next.classList.add(
                        "delayed"
                    );
                }else{
                    next.classList.remove(
                        "delayed"
                    );
                }

                let ticker = "";

                deps.slice(1)
                .forEach(dep => {

                    const delayed =
                        dep.aimedDepartureTime !==
                        dep.expectedDepartureTime;

                    const cls =
                        delayed
                        ? "time delayed"
                        : "time";

                    ticker += `
                        <span class="${cls}">
                            ${formatTime(
                              dep.expectedDepartureTime
                            )}
                        </span>
                    `;
                });

                /* Dupliseres for sømløs scrolling */
                ticker = ticker + ticker;

                route.querySelector(
                    ".ticker-content"
                ).innerHTML = ticker;

            });
    }

    document.getElementById("updated")
        .textContent =
        "Sist oppdatert " +
        new Date().toLocaleTimeString(
            "no-NO",
            {
                hour:"2-digit",
                minute:"2-digit",
                second:"2-digit"
            }
        );
}

(async function(){

    await buildBoard();
    await updateData();

    setInterval(
        updateData,
        10000
    );

})();

</script>

</body>
</html>
