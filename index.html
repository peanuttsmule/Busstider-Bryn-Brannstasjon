<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bussavganger Bryn</title>

<style>

body{
    margin:0;
    background:#000;
    color:#ffb300;
    font-family:Arial, Helvetica, sans-serif;
}

.header{
    display:flex;
    justify-content:flex-end;
    align-items:center;
    font-size:48px;
    font-weight:bold;
    padding:20px 30px;
    border-bottom:3px solid #ffb300;
}

.stopSection{
    padding:25px 30px;
}

.stopTitle{
    font-size:42px;
    font-weight:bold;
    margin-bottom:25px;
    border-bottom:2px solid #444;
    padding-bottom:10px;
}

.departureRow{
    display:grid;
    grid-template-columns:350px 1fr;
    gap:20px;
    margin-bottom:20px;
    align-items:center;
}

.destination{
    font-size:36px;
    font-weight:bold;
}

.times{
    text-align:right;
}

.time{
    display:inline-block;
    min-width:80px;
    font-size:34px;
    margin-left:10px;
}

.separator{
    height:3px;
    background:#333;
    margin:0 30px;
}

</style>
</head>
<body>

<div class="header" id="clock"></div>

<div id="content"></div>

<script>

const STOPS = [
{
    name: "BRYN BRANNSTASJON",
    id: "NSR:StopPlace:6096"
},
{
    name: "BRYNSENGVEIEN",
    id: "NSR:StopPlace:6094"
}
];

function updateClock() {

    document.getElementById("clock").textContent =
        new Date().toLocaleTimeString("no-NO", {
            hour: "2-digit",
            minute: "2-digit"
        });

}

setInterval(updateClock,1000);
updateClock();

function minutesUntil(timeString){

    const departure = new Date(timeString);
    const now = new Date();

    let minutes =
        Math.round((departure - now) / 60000);

    if(minutes < 0){
        minutes = 0;
    }

    return minutes + "m";
}

async function fetchStop(stopId){

    const query = `
    {
      stopPlace(id: "${stopId}") {
        estimatedCalls(numberOfDepartures: 50) {
          destinationDisplay {
            frontText
          }
          expectedDepartureTime
        }
      }
    }
    `;

    const response = await fetch(
        "https://api.entur.io/journey-planner/v3/graphql",
        {
            method:"POST",
            headers:{
                "Content-Type":"application/json",
                "ET-Client-Name":"bryn-tavle"
            },
            body:JSON.stringify({
                query:query
            })
        }
    );

    const json = await response.json();

    return json.data.stopPlace.estimatedCalls;
}

async function loadDepartures(){

    const content =
        document.getElementById("content");

    content.innerHTML = "";

    for(const stop of STOPS){

        let departures =
            await fetchStop(stop.id);

        let grouped = {};

        departures.forEach(dep => {

            const destination =
                dep.destinationDisplay.frontText;

            if(!grouped[destination]){
                grouped[destination] = [];
            }

            grouped[destination].push(
                dep.expectedDepartureTime
            );
        });

        let html = `
        <div class="stopSection">
            <div class="stopTitle">
                ${stop.name}
            </div>
        `;

        Object.keys(grouped)
            .sort()
            .forEach(destination => {

                const nextDepartures =
                    grouped[destination].slice(0,4);

                html += `
                <div class="departureRow">
                    <div class="destination">
                        ${destination}
                    </div>

                    <div class="times">
                `;

                nextDepartures.forEach(time => {

                    html += `
                    <span class="time">
                        ${minutesUntil(time)}
                    </span>
                    `;
                });

                html += `
                    </div>
                </div>
                `;
            });

        html += `</div><div class="separator"></div>`;

        content.innerHTML += html;
    }
}

loadDepartures();

setInterval(loadDepartures,10000);

</script>

</body>
</html>
