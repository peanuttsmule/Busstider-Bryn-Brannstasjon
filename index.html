<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Bussavganger</title>

<style>

body{
    margin:0;
    background:#000;
    color:#ffb300;
    font-family:Arial,Helvetica,sans-serif;
}

.header{
    text-align:right;
    font-size:46px;
    font-weight:bold;
    padding:20px;
    border-bottom:3px solid #ffb300;
}

.section{
    padding:25px;
}

.stopTitle{
    font-size:42px;
    font-weight:bold;
    margin-bottom:25px;
}

.destination{
    font-size:34px;
    font-weight:bold;
    margin-top:25px;
    margin-bottom:8px;
}

.ticker{
    overflow:hidden;
    white-space:nowrap;
    width:100%;
    border-bottom:1px solid #222;
    padding-bottom:10px;
}

.ticker-content{
    display:inline-block;
    padding-left:100%;
    animation:scroll 25s linear infinite;
    font-size:30px;
}

.time{
    margin-right:50px;
}

.delayed{
    color:#ff4444;
}

.updated{
    color:#999;
    font-size:20px;
    margin-top:25px;
}

.separator{
    height:3px;
    background:#333;
    margin:0 20px;
}

@keyframes scroll{
    from{
        transform:translateX(0);
    }

    to{
        transform:translateX(-100%);
    }
}

</style>
</head>
<body>

<div class="header" id="clock"></div>

<div id="content"></div>

<script>

const STOPS = [
{
    name:"BRYN BRANNSTASJON",
    id:"NSR:StopPlace:6096"
},
{
    name:"BRYNSENGVEIEN",
    id:"NSR:StopPlace:6094"
}
];

function updateClock(){

    document.getElementById("clock").textContent =
        new Date().toLocaleTimeString(
            "no-NO",
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        );
}

setInterval(updateClock,1000);
updateClock();

function clockTime(dateString){

    return new Date(dateString)
        .toLocaleTimeString(
            "no-NO",
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        );
}

async function getDepartures(stopId){

    const query = `
    {
      stopPlace(id:"${stopId}") {

        estimatedCalls(
          numberOfDepartures:50
        ) {

          aimedDepartureTime

          expectedDepartureTime

          destinationDisplay {
            frontText
          }
        }
      }
    }
    `;

    const response = await fetch(
        "https://api.entur.io/journey-planner/v3/graphql",
        {
            method:"POST",
            headers:{
                "Content-Type":"application/json",
                "ET-Client-Name":"bryn-tavle"
            },
            body:JSON.stringify({
                query:query
            })
        }
    );

    const json =
        await response.json();

    return json.data.stopPlace.estimatedCalls;
}

async function loadData(){

    const content =
        document.getElementById("content");

    content.innerHTML="";

    const updated =
        new Date().toLocaleTimeString(
            "no-NO",
            {
                hour:"2-digit",
                minute:"2-digit",
                second:"2-digit"
            }
        );

    for(const stop of STOPS){

        const departures =
            await getDepartures(stop.id);

        const groups = {};

        departures.forEach(dep=>{

            const destination =
                dep.destinationDisplay.frontText;

            if(!groups[destination]){
                groups[destination]=[];
            }

            groups[destination].push(dep);

        });

        let html = `
        <div class="section">

            <div class="stopTitle">
                ${stop.name}
            </div>
        `;

        Object.keys(groups)
            .sort()
            .forEach(destination=>{

                let tickerHTML = "";

                groups[destination]
                .slice(0,8)
                .forEach(dep=>{

                    const delayed =
                        dep.aimedDepartureTime !==
                        dep.expectedDepartureTime;

                    const css =
                        delayed
                        ? "time delayed"
                        : "time";

                    tickerHTML += `
                        <span class="${css}">
                            ${clockTime(
                                dep.expectedDepartureTime
                            )}
                        </span>
                    `;
                });

                html += `
                    <div class="destination">
                        ${destination}
                    </div>

                    <div class="ticker">

                        <div class="ticker-content">

                            ${tickerHTML}

                        </div>

                    </div>
                `;
            });

        html += `
            <div class="updated">

                Sist oppdatert:
                ${updated}

            </div>

        </div>

        <div class="separator"></div>
        `;

        content.innerHTML += html;
    }
}

loadData();

setInterval(
    loadData,
    10000
);

</script>

</body>
</html>
